[project]
name = "conversor-temperatura"
version = "0.1.0"
description = "Conversor de temperatura generado con Spec Kit (Bloque 3.B)"
readme = "README.md"
authors = [
    { name = "SebastianJara21", email = "sebasjarac111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
conversor-speckit = "conversor_temperatura:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-json-report>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
