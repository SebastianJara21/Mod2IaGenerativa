[project]
name = "control-de-gastos"
version = "1.0.0"
description = "Personal expense tracking system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "email-validator>=2.0",
    "python-multipart>=0.0.6",
    "mcp>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/mcp/server.py",
    "app/mcp/auth.py",
    "app/logging_config.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
